<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBT Skala Matematika Kelas 7 SMP</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1d2433;--m:#5f6b85;--p:#2f5bea;--ok:#12a150;--no:#d92d3a;--b:#dde3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--c:#1a2132;--t:#e8ecf6;--m:#9aa6c2;--p:#6b8cff;--ok:#3ed081;--no:#ff6b76;--b:#2b3550}}
:root[data-theme="dark"]{--bg:#10141f;--c:#1a2132;--t:#e8ecf6;--m:#9aa6c2;--p:#6b8cff;--ok:#3ed081;--no:#ff6b76;--b:#2b3550}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 10px;color:var(--p)}
.m{color:var(--m);font-size:.9rem}
input[type=text]{width:100%;padding:10px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit;margin-top:6px}
.q{padding:12px 0;border-top:1px solid var(--b)}.q:first-of-type{border-top:0}
.qt{font-weight:600;margin-bottom:8px}
label.o{display:block;padding:9px 12px;border:1px solid var(--b);border-radius:10px;margin:6px 0;cursor:pointer}
label.o:has(input:checked){border-color:var(--p);background:color-mix(in srgb,var(--p) 12%,transparent)}
label.o input{margin-right:8px}
.good{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 16%,transparent)!important}
.bad{border-color:var(--no)!important;background:color-mix(in srgb,var(--no) 16%,transparent)!important}
.ex{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);font-size:.92rem}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--p);color:#fff;margin:4px 6px 4px 0}
button.s{background:transparent;color:var(--p);border:1px solid var(--p)}
button.wa{background:#1fa855}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
#pb{height:8px;background:var(--b);border-radius:6px;overflow:hidden}#pf{height:100%;width:0;background:var(--p);transition:width .2s}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}
.big{font-size:2rem;font-weight:800}
sup{font-size:.7em}
</style></head><body><div class="w">
<div class="card"><h1>CBT Skala Matematika Kelas 7 SMP</h1>
<div class="m">1 bab × 5 soal = 5 soal pilihan ganda. Jawaban tersimpan otomatis di browser.</div>
<div style="margin-top:12px"><label>Nama<input type="text" id="nm" placeholder="Nama lengkap"></label></div>
<div style="margin-top:8px"><label>Sekolah<input type="text" id="sk" placeholder="Asal sekolah"></label></div></div>
<div id="bar"><div class="m"><span id="cnt">0</span>/5 terjawab</div><div id="pb"><div id="pf"></div></div></div>
<div id="qs"></div>
<div class="card" id="act"><button id="sub">Selesai &amp; Lihat Hasil</button><button class="s" id="rs">Ulangi</button></div>
<div class="card" id="res" style="display:none"></div>
</div>
<script>
var B=[
["Skala",[
["Skala peta 1 : 1.500.000. Jarak dua kota pada peta 6 cm. Jarak sebenarnya ...",["9 km","90 km","900 km","25 km"],1,"6 × 1.500.000 = 9.000.000 cm = 90 km."],
["Jarak sebenarnya 36 km, skala peta 1 : 600.000. Jarak pada peta ...",["60 cm","0,6 cm","600 cm","6 cm"],3,"36 km = 3.600.000 cm; 3.600.000 : 600.000 = 6 cm."],
["Jarak sebenarnya 48 km, pada peta 8 cm. Skala peta tersebut adalah ...",["1 : 60.000","1 : 6.000.000","1 : 384.000","1 : 600.000"],3,"48 km = 4.800.000 cm; 4.800.000 : 8 = 600.000."],
["Denah rumah berskala 1 : 150. Panjang ruang tamu pada denah 8 cm. Panjang sebenarnya ...",["1,2 m","120 m","12 m","18,75 m"],2,"8 × 150 = 1.200 cm = 12 m."],
["Skala peta 1 : 500.000. Jarak dua kota di peta 9 cm. Jika ditempuh dengan mobil 45 km/jam, waktu tempuhnya ...",["1 jam 30 menit","45 menit","1 jam","2 jam"],2,"9 × 500.000 = 4.500.000 cm = 45 km; 45 : 45 = 1 jam."]]]
];
var K="cbt-skala-kelas7",ans={},done=false,$=function(i){return document.getElementById(i)};
function f(s){return s.replace(/\^(-?\d+)/g,"<sup>$1</sup>")}
function save(){try{localStorage.setItem(K,JSON.stringify({a:ans,n:$("nm").value,s:$("sk").value}))}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem(K)||"null");if(d){ans=d.a||{};$("nm").value=d.n||"";$("sk").value=d.s||""}}catch(e){}}
function upd(){var n=Object.keys(ans).length;$("cnt").textContent=n;$("pf").style.width=(n/5*100)+"%"}
function render(){var h="",no=0;B.forEach(function(b,bi){h+='<div class="card"><h2>Bagian '+(bi+1)+' · '+b[0]+'</h2>';
b[1].forEach(function(q,qi){var id=bi+"_"+qi;no++;h+='<div class="q" id="q'+id+'"><div class="qt">'+no+'. '+f(q[0])+'</div>';
q[1].forEach(function(o,oi){h+='<label class="o" id="o'+id+'_'+oi+'"><input type="radio" name="r'+id+'" value="'+oi+'"'+(ans[id]===oi?" checked":"")+'>'+String.fromCharCode(65+oi)+'. '+f(o)+'</label>'});
h+='<div class="ex" id="e'+id+'" style="display:none"></div></div>'});h+='</div>'});
$("qs").innerHTML=h;
document.querySelectorAll('input[type=radio]').forEach(function(r){r.addEventListener("change",function(){if(done)return;ans[r.name.slice(1)]=+r.value;save();upd()})});upd()}
function fin(){if(!$("nm").value.trim()||!$("sk").value.trim()){alert("Isi nama dan sekolah dulu.");window.scrollTo(0,0);return}
var n=Object.keys(ans).length;if(n<5&&!confirm("Masih ada "+(5-n)+" soal belum dijawab. Tetap selesai?"))return;
done=true;var tot=0,rows="",txt="";
B.forEach(function(b,bi){var s=0;b[1].forEach(function(q,qi){var id=bi+"_"+qi,u=ans[id],ok=u===q[2];if(ok)s++;
document.querySelectorAll('input[name="r'+id+'"]').forEach(function(r){r.disabled=true});
$("o"+id+"_"+q[2]).classList.add("good");if(u!==undefined&&!ok)$("o"+id+"_"+u).classList.add("bad");
var e=$("e"+id);e.style.display="block";e.innerHTML=(ok?"✅ Benar. ":"❌ "+(u===undefined?"Belum dijawab. ":"Salah. ")+"Jawaban: "+String.fromCharCode(65+q[2])+". ")+q[3]});
tot+=s;rows+="<tr><td>"+(bi+1)+". "+b[0]+"</td><td>"+s+"/5</td></tr>";txt+="\n"+(bi+1)+". "+b[0].replace(/&amp;/g,"&")+": "+s+"/5"});
var sc=Math.round(tot/5*100);
$("res").style.display="block";$("res").innerHTML='<h2>Hasil</h2><div class="big">'+sc+'</div><div class="m">'+tot+' benar dari 5 soal</div><table>'+rows+'</table><div style="margin-top:12px"><button class="wa" id="wa">Kirim ke WhatsApp</button></div>';
var msg="Hasil CBT Skala Matematika Kelas 7 SMP\nNama: "+$("nm").value+"\nSekolah: "+$("sk").value+"\nNilai: "+sc+" ("+tot+"/5)\n"+txt;
$("wa").onclick=function(){window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank")};
$("act").style.display="none";$("res").scrollIntoView({behavior:"smooth"})}
$("sub").onclick=fin;
$("rs").onclick=function(){if(confirm("Hapus semua jawaban dan mulai ulang?")){try{localStorage.removeItem(K)}catch(e){}ans={};done=false;$("res").style.display="none";$("act").style.display="block";render();window.scrollTo(0,0)}};
$("nm").addEventListener("input",save);$("sk").addEventListener("input",save);
load();render();
</script></body></html>
